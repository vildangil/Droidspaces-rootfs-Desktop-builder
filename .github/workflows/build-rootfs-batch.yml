name: Build multiple Droidspaces RootFS (multi-select)

on:
  workflow_dispatch:
    inputs:
      distro_arch:
        description: "Distribution: Arch Linux ARM"
        type: boolean
        default: true
      distro_debian13:
        description: "Distribution: Debian 13"
        type: boolean
        default: false
      distro_ubuntu24:
        description: "Distribution: Ubuntu 24"
        type: boolean
        default: false
      distro_ubuntu25:
        description: "Distribution: Ubuntu 25"
        type: boolean
        default: false
      distro_ubuntu26:
        description: "Distribution: Ubuntu 26"
        type: boolean
        default: false
      distro_fedora43:
        description: "Distribution: Fedora 43"
        type: boolean
        default: false
      distro_fedora44:
        description: "Distribution: Fedora 44"
        type: boolean
        default: false
      desktop_none:
        description: "Desktop: none (CLI-only RootFS)"
        type: boolean
        default: false
      desktop_kde:
        description: "Desktop: KDE Plasma"
        type: boolean
        default: false
      desktop_kde_mobile:
        description: "Desktop: KDE Mobile"
        type: boolean
        default: false
      desktop_gnome:
        description: "Desktop: GNOME (requires matching patched Mutter release)"
        type: boolean
        default: false
      desktop_anland_next:
        description: "Desktop: Anland Next"
        type: boolean
        default: false
      desktop_niri:
        description: "Desktop: Niri (Arch only)"
        type: boolean
        default: true
      kde_backend:
        description: "KDE Plasma display backend"
        type: choice
        options:
          - anland-wayland
          - x11
        default: anland-wayland
      custom_username:
        description: "RootFS username"
        type: string
        default: arch
      desktop_autostart:
        description: "Start desktop automatically (ignored for CLI)"
        type: boolean
        default: true
      gpu_profile:
        description: "Android GPU: Qualcomm KGSL or MediaTek/ARM Mali"
        type: choice
        options:
          - qualcomm-kgsl
          - mediatek-mali
        default: qualcomm-kgsl
      enable_mesa:
        description: "Install Qualcomm KGSL Mesa (ignored for MediaTek/Mali)"
        type: boolean
        default: true
      enable_8gen2_wayland:
        description: "Snapdragon 8 Gen 2 Wayland workaround"
        type: boolean
        default: false
      enable_kfgj:
        description: "Install development tools"
        type: boolean
        default: false
      enable_zh_tz:
        description: "Chinese language and Shanghai timezone"
        type: boolean
        default: false
      enable_srf:
        description: "Install Fcitx5"
        type: boolean
        default: false
      wayland_package_repository:
        description: "AnLand packages: owner/repo"
        type: string
        default: Goldzxcbug/droidspaces-package

permissions:
  contents: write

concurrency:
  group: droidspaces-batch-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan compatible combinations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Select distributions and desktops
        id: plan
        env:
          DISTRO_ARCH: ${{ inputs.distro_arch }}
          DISTRO_DEBIAN_13: ${{ inputs.distro_debian13 }}
          DISTRO_UBUNTU_24: ${{ inputs.distro_ubuntu24 }}
          DISTRO_UBUNTU_25: ${{ inputs.distro_ubuntu25 }}
          DISTRO_UBUNTU_26: ${{ inputs.distro_ubuntu26 }}
          DISTRO_FEDORA_43: ${{ inputs.distro_fedora43 }}
          DISTRO_FEDORA_44: ${{ inputs.distro_fedora44 }}
          DESKTOP_NONE: ${{ inputs.desktop_none }}
          DESKTOP_KDE: ${{ inputs.desktop_kde }}
          DESKTOP_KDE_MOBILE: ${{ inputs.desktop_kde_mobile }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_ANLAND_NEXT: ${{ inputs.desktop_anland_next }}
          DESKTOP_NIRI: ${{ inputs.desktop_niri }}
          KDE_BACKEND: ${{ inputs.kde_backend }}
        run: bash scripts/ci/build-batch-matrix.sh

  build:
    name: ${{ matrix.target }} / ${{ matrix.desktop }} / ${{ matrix.backend }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: en
      build_target: ${{ matrix.target }}
      custom_username: ${{ inputs.custom_username }}
      desktop: ${{ matrix.desktop }}
      desktop_autostart: ${{ matrix.desktop != 'none' && inputs.desktop_autostart }}
      display_backend: ${{ matrix.backend }}
      PulseAudio: ${{ matrix.backend == 'x11' && matrix.desktop != 'none' && 'socket' || 'none' }}
      enable_zh_tz: ${{ inputs.enable_zh_tz }}
      # On Mali, never install Adreno/KGSL-specific Mesa overrides.
      # Stock distro Mesa is kept; Mali accelerated AnLand still requires
      # a compatible host DMA-BUF/DRM path and GPU driver.
      enable_mesa: ${{ inputs.gpu_profile == 'qualcomm-kgsl' && inputs.enable_mesa }}
      enable_8gen2_wayland: ${{ inputs.gpu_profile == 'qualcomm-kgsl' && inputs.enable_8gen2_wayland }}
      nosnap: false
      enable_systemd257: false
      enable_srf: ${{ inputs.enable_srf }}
      enable_binfmt: false
      enable_yj: true
      enable_kfgj: ${{ inputs.enable_kfgj }}
      enable_zip: true
      enable_docker: false
      wayland_package_repository: ${{ inputs.wayland_package_repository }}
      batch_key: batch-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.desktop }}
      publish_release: false

  release:
    name: Publish all selected RootFS images in one Release
    needs: [plan, build]
    # No partial release if any matrix entry failed or was cancelled.
    if: ${{ needs.plan.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all RootFS archives from this batch run
        uses: actions/download-artifact@v7
        with:
          pattern: batch-${{ github.run_id }}-${{ github.run_attempt }}-*-rootfs
          merge-multiple: true
          path: release_assets

      - name: Verify files and prepare release notes
        env:
          MATRIX_JSON: ${{ needs.plan.outputs.matrix }}
          GPU_PROFILE: ${{ inputs.gpu_profile }}
          USERNAME: ${{ inputs.custom_username }}
          ANLAND_PACKAGES: ${{ inputs.wayland_package_repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release_assets/*.tar.xz)
          expected="$(jq -r '.include | length' <<<"$MATRIX_JSON")"
          if (( expected == 0 || ${#archives[@]} != expected )); then
            printf 'Expected %s RootFS archives, found %s. Refusing partial release.\n' "$expected" "${#archives[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${archives[@]}" | sort -u > release_assets/file-list.txt
          if [[ "$(wc -l < release_assets/file-list.txt)" -ne "$expected" ]]; then
            echo "Duplicate RootFS archive names in the batch; aborting." >&2
            exit 1
          fi
          {
            echo "# DroidSpaces multi-select RootFS"
            echo
            echo "All selected compatible distributions and desktops from one Actions run."
            echo
            echo "- Build: $RUN_URL"
            echo "- Username: $USERNAME"
            echo "- GPU profile: $GPU_PROFILE"
            echo "- AnLand packages: $ANLAND_PACKAGES"
            echo
            echo "## Built combinations"
            echo
            echo '| Distribution | Desktop | Backend |'
            echo '| --- | --- | --- |'
            jq -r '.include[] | "| \(.target) | \(.desktop) | \(.backend) |"' <<<"$MATRIX_JSON"
            echo
            echo "## Files"
            echo
            sed 's#^release_assets/#- #' release_assets/file-list.txt
          } > release-notes.md
          rm -f release_assets/file-list.txt
          printf 'Verified %s RootFS images for one release.\n' "$expected"

      - name: Create one draft Release with all RootFS archives
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: batch-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: "DroidSpaces RootFS Batch #${{ github.run_number }} (attempt ${{ github.run_attempt }})"
          body_path: release-notes.md
          files: release_assets/*.tar.xz
          fail_on_unmatched_files: true
          draft: true
          prerelease: false

      - name: Publish the verified batch Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || {
            echo "Draft release ID is missing or invalid." >&2
            exit 1
          }
          gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false --silent
